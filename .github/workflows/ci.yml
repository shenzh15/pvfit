name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: '1'
  OPENBLAS_NUM_THREADS: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.9.13'
          enable-cache: true
      - run: uv sync --locked --group dev --python '${{ matrix.python }}'
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/python scripts/check_docs.py
      - name: Unit, synthetic regression and pipeline tests
        run: .venv/bin/python -m unittest discover -s tests -v

  distribution:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dependencies: [locked, latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.9.13'
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: uv build
      - name: Install and run wheel outside checkout
        run: .venv/bin/python scripts/check_distribution.py ${{ matrix.dependencies == 'latest' && '--unlocked' || '' }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.dependencies == 'locked'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, distribution]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: distributions
          path: dist
      - name: Verify version and extract release notes
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag and package version differ'
          source = Path('pvfit/__init__.py').read_text()
          assert f'__version__ = "{version}"' in source, 'Module and package version differ'
          changelog = Path('CHANGELOG.md').read_text()
          section = re.search(r'^## \[' + re.escape(version) + r'\].*?\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          assert section, 'Version is missing from CHANGELOG.md'
          Path('release-notes.md').write_text(section.group(1).strip() + '\n')
          PY
      - name: Publish tested distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --verify-tag --title "PVFit $GITHUB_REF_NAME" --notes-file release-notes.md
