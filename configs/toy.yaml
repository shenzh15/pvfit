# Reconstruction settings for the synthetic sample written by `pvfit toy`.
# Analysis settings come from configs/analysis.yaml as usual.
paths:
  input_root: input/toy_sample.root
  track_tree_name: velo_kalman_filter/monitor_tree
  mc_vertex_tree_name: mc_pv_dumper/MCPV_effective_tree
  output_dir: output/toy
  hdf5_file: fit_results.h5

workflow:
  event_number: -1
  max_workers: 2

algorithm:
  minTracks: 2.5
  smear_window_size: 2
  beamline_chi2_cut: true
  max_track_bl_chi2: 10.0
  z0_err_cut: true
  pp_max_track_z0_err: 1.5
  z_range:
    min: -200
    max: 200
  t_range:
    min: -0.8
    max: 0.8
  bins:
    z: 800
    t: 64  # keeps the 0.025 ns bin width of configs/reconstruction.yaml
  max_chi2: 10
  is_adaptive_tukey: true
  drop_low_track_seeds: true
  merge_vertices: true
  nsigma_merge: 5
